name: Daily Market Screener

on:
  schedule:
    # Runs at 11:00 AM IST (05:30 UTC) every weekday
    - cron: "30 05 * * 1-5"
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Give the job permission to write back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a token that can push commits back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run screener
        env:
          EMAIL_ADDRESS:        ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD:       ${{ secrets.EMAIL_PASSWORD }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python text_stock.py

      - name: Save position history to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screener_history.json
          git diff --staged --quiet || git commit -m "chore: update screener history [skip ci]"
          git push
        # The [skip ci] tag in the commit message prevents an infinite loop
        # where the commit itself triggers another workflow run

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-log-${{ github.run_id }}
          path: "*.log"
